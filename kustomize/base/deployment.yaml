apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_LOG_FIELDS_SERVICE
              value: "registry"
            - name: REGISTRY_HTTP_ADDR
              value: ":5000"
            - name: REGISTRY_STORAGE_CACHE_LAYERINFO
              value: "inmemory"
            - name: REGISTRY_STORAGE_S3_REGION
              value: "us-east-1"
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: "http://minio.fava.casa:9000"
            - name: REGISTRY_STORAGE_S3_ENCRYPT
              value: "false"
            - name: REGISTRY_STORAGE_S3_SECURE
              value: "false"
            - name: REGISTRY_STORAGE_S3_V4AUTH
              value: "true"
            - name: REGISTRY_STORAGE_S3_SECURE
              value: "false"
            - name: REGISTRY_STORAGE_S3_CHUNKSIZE
              value: "5242880"
            - name: REGISTRY_STORAGE_S3_ROOTDIRECTORY
              value: "/"
            - secretRef:
                name: s3-credentials
