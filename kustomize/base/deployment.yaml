apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_LOG_LEVEL
              value: "info"
            - name: REGISTRY_STORAGE
              value: "s3"
            - name: REGISTRY_STORAGE_S3_REGION
              value: "us-east-1"
            - name: REGISTRY_STORAGE_S3_BUCKET
              value: "registry"
            - name: REGISTRY_STORAGE_S3_REGIONENDPOINT
              value: "http://minio.fava.casa:9000"
            - name: REGISTRY_STORAGE_S3_SECURE
              value: "false"
          envFrom:
            - secretRef:
                name: s3-credentials
